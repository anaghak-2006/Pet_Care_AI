
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health History - PetCareAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #263238;
    }

    .container {
      max-width: 850px;
      margin: 20px auto;
    }

    .header {
      background: #2d8b83;
      color: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 10px;
    }

    .header p {
      margin: 0;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 18px;
      padding: 10px 16px;
      background: #e0e7ef;
      color: #263238;
      text-decoration: none;
      border-radius: 6px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccd5df;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 11px 17px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .save-button {
      background: #2d8b83;
      color: white;
      margin-top: 18px;
    }

    .delete-button {
      background: #d9534f;
      color: white;
      margin-top: 10px;
    }

    .record {
      border: 1px solid #dce4ec;
      border-left: 5px solid #2d8b83;
      border-radius: 8px;
      padding: 16px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .record h3 {
      margin-top: 0;
      color: #23756e;
    }

    .record p {
      line-height: 1.5;
    }

    .empty-message {
      color: #65717d;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <a class="back-button" href="dashboard.html">
      ← Back to Dashboard
    </a>

    <div class="header">
      <h1>🩺 Health History</h1>
      <p>Record and manage your pet's medical visits and treatment notes.</p>
    </div>

    <div class="card">
      <h2>Add Health Record</h2>

      <form id="healthForm">
        <label for="petName">Pet Name</label>
        <input
          type="text"
          id="petName"
          name="petName"
          required
          placeholder="Enter your pet's name"
        >

        <label for="visitDate">Visit Date</label>
        <input
          type="date"
          id="visitDate"
          name="visitDate"
          required
        >

        <label for="recordType">Record Type</label>
        <select id="recordType" name="recordType" required>
          <option value="">Select record type</option>
          <option value="General Checkup">General Checkup</option>
          <option value="Vaccination">Vaccination</option>
          <option value="Illness">Illness</option>
          <option value="Medication">Medication</option>
          <option value="Surgery">Surgery</option>
          <option value="Other">Other</option>
        </select>

        <label for="vetName">Veterinarian Name</label>
        <input
          type="text"
          id="vetName"
          name="vetName"
          placeholder="Enter veterinarian's name"
        >

        <label for="healthNotes">Symptoms, Diagnosis or Treatment</label>
        <textarea
          id="healthNotes"
          name="healthNotes"
          required
          placeholder="Enter health details, treatment or notes"
        ></textarea>

        <button type="submit" class="save-button">
          Save Health Record
        </button>
      </form>
    </div>

    <div class="card">
      <h2>Saved Health Records</h2>
      <div id="healthRecords">
        <p class="empty-message">Loading health records...</p>
      </div>
    </div>

  </div>

  <script>
    const healthStorageKey = "petcareai_health_records";

    const healthForm = document.getElementById("healthForm");
    const healthRecords = document.getElementById("healthRecords");

    function getHealthRecords() {
      try {
        const saved = localStorage.getItem(healthStorageKey);
        const records = saved ? JSON.parse(saved) : [];

        return Array.isArray(records) ? records : [];
      } catch (error) {
        return [];
      }
    }

    function saveHealthRecords(records) {
      try {
        localStorage.setItem(
          healthStorageKey,
          JSON.stringify(records)
        );
        return true;
      } catch (error) {
        alert("Could not save the record in this browser.");
        return false;
      }
    }

    function renderHealthRecords() {
      const records = getHealthRecords();

      healthRecords.replaceChildren();

      if (records.length === 0) {
        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "No health records added yet.";
        healthRecords.appendChild(message);
        return;
      }

      records.forEach(function(record) {
        const card = document.createElement("div");
        card.className = "record";

        const title = document.createElement("h3");
        title.textContent =
          (record.petName || "Pet") + " — " +
          (record.recordType || "Health Record");

        const date = document.createElement("p");
        date.textContent = "Visit Date: " + (record.visitDate || "Not provided");

        const vet = document.createElement("p");
        vet.textContent = "Veterinarian: " + (record.vetName || "Not provided");

        const notes = document.createElement("p");
        notes.textContent = "Notes: " + (record.healthNotes || "None");

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.textContent = "Delete Record";

        deleteButton.addEventListener("click", function() {
          const confirmed = confirm(
            "Are you sure you want to delete this health record?"
          );

          if (!confirmed) return;

          const updatedRecords = getHealthRecords().filter(
            function(item) {
              return item.id !== record.id;
            }
          );

          if (saveHealthRecords(updatedRecords)) {
            renderHealthRecords();
          }
        });

        card.appendChild(title);
        card.appendChild(date);
        card.appendChild(vet);
        card.appendChild(notes);
        card.appendChild(deleteButton);

        healthRecords.appendChild(card);
      });
    }

    healthForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const record = {
        id: Date.now().toString() + Math.random().toString(36).slice(2),
        petName: document.getElementById("petName").value.trim(),
        visitDate: document.getElementById("visitDate").value,
        recordType: document.getElementById("recordType").value,
        vetName: document.getElementById("vetName").value.trim(),
        healthNotes: document.getElementById("healthNotes").value.trim()
      };

      if (!record.petName || !record.visitDate ||
          !record.recordType || !record.healthNotes) {
        alert("Please fill in all required fields.");
        return;
      }

      const records = getHealthRecords();
      records.unshift(record);

      if (saveHealthRecords(records)) {
        healthForm.reset();
        renderHealthRecords();
        alert("Health record saved successfully!");
      }
    });

    renderHealthRecords();
  </script>
</body>
</html>
